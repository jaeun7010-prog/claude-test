<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수리 작명소</title>
  <meta name="description" content="정통 수리성명학(원획법·81수리·삼재오행)으로 이름을 풀이하고 추천받는 작명 도구">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="seal" aria-hidden="true">名</div>
    <h1>수리 작명소</h1>
    <p class="sub">정통 수리성명학으로 이름의 기운을 읽습니다</p>
  </header>

  <main>
    <nav class="tabs" role="tablist" aria-label="기능 선택">
      <button class="tab active" role="tab" id="tab-analyze" aria-selected="true" aria-controls="panel-analyze">이름 풀이</button>
      <button class="tab" role="tab" id="tab-recommend" aria-selected="false" aria-controls="panel-recommend">이름 추천</button>
    </nav>

    <!-- 이름 풀이 -->
    <section class="panel" id="panel-analyze" role="tabpanel" aria-labelledby="tab-analyze">
      <form id="analyze-form" class="card" autocomplete="off">
        <h2>이름 입력</h2>
        <p class="hint">한글 음(예: <b>서</b>)을 입력하면 한자 후보가 나타납니다. 한자를 직접 입력해도 됩니다. 사전에 없는 한자는 획수를 직접 적어주세요.</p>

        <div class="fields">
          <div class="field surname">
            <label for="surname">성씨</label>
            <select id="surname"></select>
          </div>

          <div class="field">
            <label for="c1">이름 첫 글자</label>
            <div class="pair">
              <input id="c1" type="text" maxlength="2" placeholder="서 / 瑞" inputmode="text">
              <input id="s1" type="number" min="1" max="40" placeholder="획" aria-label="첫 글자 획수">
            </div>
            <div class="chips" id="chips1"></div>
            <div class="info" id="info1"></div>
          </div>

          <div class="field">
            <label for="c2">이름 둘째 글자 <span class="opt">(외자면 비움)</span></label>
            <div class="pair">
              <input id="c2" type="text" maxlength="2" placeholder="연 / 姸" inputmode="text">
              <input id="s2" type="number" min="1" max="40" placeholder="획" aria-label="둘째 글자 획수">
            </div>
            <div class="chips" id="chips2"></div>
            <div class="info" id="info2"></div>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="primary">이름 풀이하기</button>
          <button type="button" id="reset" class="ghost">초기화</button>
        </div>
        <p class="error" id="form-error" role="alert"></p>
      </form>

      <div id="result" class="result" hidden></div>
    </section>

    <!-- 이름 추천 -->
    <section class="panel" id="panel-recommend" role="tabpanel" aria-labelledby="tab-recommend" hidden>
      <form id="recommend-form" class="card" autocomplete="off">
        <h2>원하는 소리로 추천받기</h2>
        <p class="hint">성씨와 이름의 한글 소리를 정하면, 수리가 좋은 한자 조합을 점수 순으로 찾아드립니다.</p>
        <div class="fields">
          <div class="field surname">
            <label for="r-surname">성씨</label>
            <select id="r-surname"></select>
          </div>
          <div class="field">
            <label for="r-reading">이름 소리 <span class="opt">(1~2글자)</span></label>
            <input id="r-reading" type="text" maxlength="2" placeholder="예: 서연" required>
          </div>
          <div class="field">
            <label for="r-min">최소 점수 <output id="r-min-out">70</output>점</label>
            <input id="r-min" type="range" min="40" max="95" step="5" value="70">
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="primary">이름 찾기</button>
        </div>
        <p class="error" id="r-error" role="alert"></p>
      </form>
      <div id="r-results" class="r-results"></div>
    </section>
  </main>

  <footer>
    <p>원획법(原劃法) 기준 · 한자 사전은 자주 쓰는 인명용 한자 일부만 수록되어 있습니다.</p>
    <p>이 도구는 전통 성명학을 바탕으로 한 참고용입니다. 이름의 의미와 부르는 소리, 가족의 뜻이 가장 중요합니다.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
